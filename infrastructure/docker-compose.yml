services:

  redis:
    image: ${REDIS_IMAGE:-redis:alpine}
    container_name: ${REDIS_CONTAINER_NAME:-skyquery-redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi'
    volumes:
      - redis_data:/data

volumes:
  redis_data:
